<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>手机屏幕反射率</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=20261008-reflectance-height-fix-1">
</head>
<body>
<main id="app" aria-label="手机屏幕反射率">
  <header class="toolbar">
    <div id="conditions" class="conditions" aria-label="测量状态"></div>
    <div class="toolbar-actions">
      <div id="kinds" class="segmented" role="group" aria-label="反射率类型"></div>
      <button id="measureInfo" class="info-button" type="button">测量信息</button>
    </div>
  </header>
  <section class="chart-card" aria-label="全光谱反射率曲线">
    <div id="chartWrap" class="chart-wrap">
      <svg id="chart" role="img" tabindex="0" aria-label="400 至 700 纳米反射率曲线"></svg>
      <div id="readout" class="readout" aria-live="off">
        <div id="readoutText" class="readout-text"></div>
        <button id="clearReadout" class="readout-close" type="button" aria-label="收起读数">×</button>
      </div>
      <span class="watermark" aria-hidden="true">野生的装机宅</span>
    </div>
    <div id="legend" class="legend" aria-label="曲线图例"></div>
  </section>
</main>
<dialog id="infoDialog" aria-labelledby="infoTitle">
  <div class="dialog-head">
    <h2 id="infoTitle">测量信息</h2>
    <button id="closeInfo" class="close-button" type="button" aria-label="关闭">×</button>
  </div>
  <div class="dialog-body">
    <p class="method-note">曲线由原始反射率图数字化提取，提取估计误差约 ±1 nm、±0.05 个百分点。2 nm 网格用于曲线展示，不代表仪器采样间隔。</p>
    <div id="curveDetails"></div>
  </div>
</dialog>
<script type="module" src="app.js?v=20261008-reflectance-height-fix-1"></script>
</body>
</html>
